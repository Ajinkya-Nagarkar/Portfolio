name: Update GitHub Projects (auto-generate)

on:
    schedule:
        - cron: "0 9 * * 0" # Sunday 09:00 UTC
    workflow_dispatch:
        inputs:
            github_user:
                description: "GitHub username"
                required: false

jobs:
    generate:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"

            - name: Run generator
              env:
                  GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
                  PORTFOLIO_GITHUB_USERNAME: ${{ github.event.inputs.github_user || vars.PORTFOLIO_GITHUB_USERNAME }}
              run: |
                  if [ -z "$PORTFOLIO_GITHUB_USERNAME" ]; then
                    echo "PORTFOLIO_GITHUB_USERNAME is not set"
                    exit 1
                  fi
                  node scripts/generateGithubProjects.js --username "$PORTFOLIO_GITHUB_USERNAME"

            - name: Commit changes if any
              env:
                  GH_PAT: ${{ secrets.GH_PAT }}
              run: |
                  git status --porcelain
                  if [ -z "$(git status --porcelain)" ]; then
                    echo "No changes to commit"
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add src/config/content/projects/github.ts
                  git commit -m "chore: update github projects (auto-generated)"

                  git push https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
